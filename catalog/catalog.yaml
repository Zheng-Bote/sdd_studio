version: "1.1.0"
rules:
  - id: SDD-001
    title: Verfassung vorhanden
    severity:
      default: error
    profile: minimal
    check: constitution_present
    gate_default: [pre-implementation, pre-merge]
    baseline: allowed
    contract: handbuch/03-mechanismen.md#sdd-001-vertrag
    rationale: >
      Ohne Verfassung fehlt die oberste Quelle der Präzedenzordnung; jede
      Architektur- oder Sicherheitsregel wäre nur implizit.
    handbook: handbuch/03-mechanismen.md#sdd-001

  - id: SDD-002a
    title: Markdown-Verfassung enthält die Pflichtabschnitte
    severity:
      default: error
    profile: minimal
    check: constitution_markdown_sections
    gate_default: [pre-implementation, pre-merge]
    baseline: allowed
    contract: handbuch/03-mechanismen.md#sdd-002a-vertrag
    rationale: >
      Architektur, Sicherheit und strikte Regeln sind die Abschnitte, auf die
      Feature-Artefakte und Agenten verweisen. Fehlt einer, ist die Verfassung
      an dieser Stelle stumm.
    handbook: handbuch/03-mechanismen.md#sdd-002a

  - id: SDD-020
    title: PRD vorhanden, wenn die Größenschwelle greift
    severity:
      by_gate:
        pre-implementation: error
        pre-merge: error
    profile: standard
    check: feature_prd_present
    gate_default: [pre-implementation, pre-merge]
    baseline: allowed
    contract: handbuch/03-mechanismen.md#sdd-020-vertrag
    rationale: >
      Ab der Größenschwelle ist eine Änderung nicht mehr allein aus Issue und
      Code nachvollziehbar. Das PRD hält fest, was und warum gebaut wird.
    handbook: handbuch/03-mechanismen.md#sdd-020

  - id: SDD-021
    title: Jedes Akzeptanzkriterium hat eine stabile Kennung
    severity:
      default: error
    profile: standard
    check: acceptance_criteria_ids
    gate_default: [pre-merge]
    baseline: allowed
    contract: handbuch/03-mechanismen.md#sdd-021-vertrag
    rationale: >
      Ohne stabile Kennung lässt sich ein Akzeptanzkriterium weder in Tests
      noch in Tasks referenzieren; die Rückverfolgbarkeit wäre behauptet.
    handbook: handbuch/03-mechanismen.md#sdd-021

  - id: SDD-022
    title: Jedes Akzeptanzkriterium ist in mindestens einer Testdatei referenziert
    severity:
      default: error
    profile: standard
    check: acceptance_criteria_tested
    gate_default: [pre-merge]
    baseline: allowed
    contract: handbuch/03-mechanismen.md#sdd-022-vertrag
    rationale: >
      Ein Akzeptanzkriterium, auf das kein Test verweist, ist eine Behauptung.
      Die Regel misst Präsenz, nicht Coverage.
    handbook: handbuch/03-mechanismen.md#sdd-022

  - id: SDD-030
    title: Tech Spec vorhanden, wenn die Größenschwelle greift
    severity:
      by_gate:
        pre-implementation: error
        pre-merge: error
    profile: standard
    check: feature_design_present
    gate_default: [pre-implementation, pre-merge]
    baseline: allowed
    contract: handbuch/03-mechanismen.md#sdd-030-vertrag
    rationale: >
      Eine Änderung über mehrere Layer oder an öffentlichen Schnittstellen
      braucht ein abgestimmtes technisches Design, bevor implementiert wird.
    handbook: handbuch/03-mechanismen.md#sdd-030

  - id: SDD-050
    title: Abgeschlossene Features sind vor dem Release archiviert
    severity:
      default: warn
      by_gate:
        pre-release: error
    profile: standard
    check: archive_state
    gate_default: [pre-merge, pre-release]
    baseline: forbidden
    contract: handbuch/03-mechanismen.md#sdd-050-vertrag
    rationale: >
      Ein Gate nach dem Release blockiert nichts. Geprüft wird daher vor dem
      Release-Tag, dass abgeschlossene Feature-Artefakte im Archiv liegen.
    handbook: handbuch/03-mechanismen.md#sdd-050

  - id: SDD-023
    title: PRD nennt Nicht-Ziele
    severity:
      default: warn
    profile: standard
    check: prd_non_goals
    gate_default: [pre-merge]
    baseline: allowed
    contract: handbuch/03-mechanismen.md#sdd-023-vertrag
    rationale: >
      Ein PRD ohne Nicht-Ziele lädt dazu ein, den Umfang während der Umsetzung
      still zu erweitern. Was ausgeschlossen ist, muss so sichtbar sein wie das Ziel.
    handbook: handbuch/03-mechanismen.md#sdd-023

  - id: SDD-031
    title: Tech Spec referenziert die AC-Kennungen, die sie umsetzt
    severity:
      default: warn
    profile: standard
    check: design_references_acs
    gate_default: [pre-merge]
    baseline: allowed
    contract: handbuch/03-mechanismen.md#sdd-031-vertrag
    rationale: >
      Ohne Bezug auf die Akzeptanzkriterien bleibt offen, welches Kriterium
      durch welchen Teil des technischen Designs erfüllt wird.
    handbook: handbuch/03-mechanismen.md#sdd-031

  - id: SDD-041
    title: Jede Task referenziert mindestens ein Akzeptanzkriterium
    severity:
      default: error
    profile: standard
    check: tasks_reference_acs
    gate_default: [pre-merge]
    baseline: allowed
    contract: handbuch/03-mechanismen.md#sdd-041-vertrag
    rationale: >
      Eine Task ohne Akzeptanzkriterium ist Arbeit ohne prüfbares Ziel; sie
      wächst den Umfang, ohne dass das PRD es zeigt.
    handbook: handbuch/03-mechanismen.md#sdd-041

  - id: SDD-051
    title: Aktive Feature-Artefakte verweisen nicht auf archivierte Feature-Artefakte
    severity:
      default: warn
    profile: standard
    check: no_links_to_archive
    gate_default: [pre-merge, pre-release]
    baseline: forbidden
    contract: handbuch/03-mechanismen.md#sdd-051-vertrag
    rationale: >
      Wer einem Verweis aus einer gültigen Spezifikation folgt, darf nicht in
      einer erledigten landen und sie für gültig halten.
    handbook: handbuch/03-mechanismen.md#sdd-051

  - id: SDD-010
    title: Änderung einer Verfassungsregel verweist auf ein ADR
    severity:
      by_gate:
        pre-implementation: error
        pre-merge: error
    profile: minimal
    check: constitution_change_has_adr
    gate_default: [pre-implementation, pre-merge]
    baseline: allowed
    contract: handbuch/03-mechanismen.md#sdd-010-vertrag
    rationale: >
      Die Verfassung hält den gültigen Zustand, das ADR die unveränderliche
      Begründung. Eine Regeländerung ohne ADR verliert ihr Warum.
    handbook: handbuch/03-mechanismen.md#sdd-010

  - id: SDD-011
    title: ADRs sind unveränderlich; Ablösung über supersedes
    severity:
      default: error
    profile: standard
    check: adr_immutable
    gate_default: [pre-merge]
    baseline: forbidden
    contract: handbuch/03-mechanismen.md#sdd-011-vertrag
    rationale: >
      Ein nachträglich umgeschriebenes ADR fälscht die Begründung der Verfassung.
      Abweichungen werden über das Lockfile quittiert, nicht über die Baseline.
    handbook: handbuch/03-mechanismen.md#sdd-011

  - id: SDD-024
    title: Der Diff weicht nicht von der erklärten Änderungsabsicht ab
    severity:
      by_gate:
        pre-merge: warn
    profile: standard
    check: diff_within_intent
    gate_default: [pre-merge]
    baseline: allowed
    contract: handbuch/03-mechanismen.md#sdd-024-vertrag
    rationale: >
      Wächst der Umfang während der Umsetzung über touches hinaus, beschreibt
      die Spezifikation nicht mehr, was gemergt wird.
    handbook: handbuch/03-mechanismen.md#sdd-024

  - id: SDD-025
    title: Jede AC-Kennung steht in einer Testdeklaration oder ihrem Rumpf
    severity:
      default: warn
    profile: standard
    check: acceptance_criteria_in_test_declarations
    gate_default: [pre-merge]
    baseline: allowed
    contract: handbuch/03-mechanismen.md#sdd-025-vertrag
    rationale: >
      SDD-022 misst Präsenz irgendwo in einer Testdatei. Ein Verweis in einem
      Test ist die schärfere, sprachadaptive Aussage — daher nur warn.
    handbook: handbuch/03-mechanismen.md#sdd-025

  - id: SDD-002b
    title: .sdd-Verfassung erfüllt die formale Grammatik
    severity:
      default: error
    profile: minimal
    check: constitution_sdd_grammar
    gate_default: [pre-implementation, pre-merge]
    baseline: allowed
    contract: handbuch/03-mechanismen.md#sdd-002b-vertrag
    rationale: >
      Eine Verfassung, die die eigene Grammatik nicht erfüllt, ist kein Vertrag,
      sondern Prosa; Agenten können Präzedenz und Eigentum dann nicht auflösen.
    handbook: handbuch/03-mechanismen.md#sdd-002b

  - id: SDD-003
    title: Verfassung enthält keine Feature-Inhalte
    severity:
      default: warn
    profile: minimal
    check: constitution_without_feature_content
    gate_default: [pre-merge]
    baseline: allowed
    contract: handbuch/03-mechanismen.md#sdd-003-vertrag
    rationale: >
      Die Verfassung hält dauerhafte, systemweite Regeln. User Stories, Tasks
      und Planung veralten mit jedem Release und verwässern ihre Autorität.
    handbook: handbuch/03-mechanismen.md#sdd-003

  - id: SDD-040
    title: Plan existiert vor der ersten Task
    severity:
      default: warn
    profile: standard
    check: plan_before_tasks
    gate_default: [pre-merge]
    baseline: allowed
    contract: handbuch/03-mechanismen.md#sdd-040-vertrag
    rationale: >
      Tasks ohne technischen Plan zerlegen ein Vorgehen, das niemand
      abgestimmt hat; Schnittstellen und Datenmodell entstehen dann nebenbei.
    handbook: handbuch/03-mechanismen.md#sdd-040

  - id: SDD-070
    title: Jede Regel ist im Handbuch dokumentiert
    severity:
      default: error
    profile: minimal
    check: catalog_handbook_section
    gate_default: [pre-implementation, pre-merge, pre-release]
    baseline: forbidden
    contract: handbuch/03-mechanismen.md#sdd-070-vertrag
    rationale: >
      Eine Regel ohne Erklärung ist für Menschen nicht nachvollziehbar. Regel und
      Handbuchabschnitt entstehen deshalb im selben Commit.
    handbook: handbuch/03-mechanismen.md#sdd-070

  - id: SDD-071
    title: Jede Regel ist im Prüfkern implementiert
    severity:
      default: error
    profile: minimal
    check: catalog_check_registered
    gate_default: [pre-implementation, pre-merge, pre-release]
    baseline: forbidden
    contract: handbuch/03-mechanismen.md#sdd-071-vertrag
    rationale: >
      Eine Regel im Katalog ohne registrierte Prüffunktion im Kern ist ein leeres
      Versprechen und täuscht Prüfabdeckung vor.
    handbook: handbuch/03-mechanismen.md#sdd-071

  - id: SDD-072
    title: Jede aktive Regel ist in mindestens einem Gate aktiv
    severity:
      default: error
    profile: minimal
    check: catalog_gate_coverage
    gate_default: [pre-implementation, pre-merge, pre-release]
    baseline: forbidden
    contract: handbuch/03-mechanismen.md#sdd-072-vertrag
    rationale: >
      Eine Regel, die in keinem effektiven Gate Eff(g) läuft, wird in CI niemals
      durchgesetzt und bleibt unsichtbar.
    handbook: handbuch/03-mechanismen.md#sdd-072

  - id: SDD-073
    title: Jede error-Regel besitzt einen Prüfvertrag im Handbuch
    severity:
      default: error
    profile: minimal
    check: catalog_error_contract
    gate_default: [pre-implementation, pre-merge, pre-release]
    baseline: forbidden
    contract: handbuch/03-mechanismen.md#sdd-073-vertrag
    rationale: >
      Blockierende Regeln (error) müssen deterministisch prüfbar sein. Ohne
      dokumentierten Prüfvertrag ist eine Regel höchstens warn.
    handbook: handbuch/03-mechanismen.md#sdd-073
